<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EasyTally</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--ink:#1d2433;--muted:#6b7385;--line:#dfe3ea;--brand:#1f6feb;--brand-ink:#fff;--warn:#fff3cd;--bad:#c62828;--good:#1b7f3b}
@media (prefers-color-scheme:dark){:root{--bg:#12151c;--card:#1b2029;--ink:#e6e9ef;--muted:#98a1b3;--line:#2c3340;--brand:#4c8dff;--brand-ink:#fff;--warn:#4a3f12;--bad:#ff6b6b;--good:#4cc27a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,"Segoe UI",Roboto,sans-serif}
header{display:flex;align-items:center;gap:12px;padding:10px 20px;background:var(--card);border-bottom:1px solid var(--line)}
header h1{font-size:17px;margin:0}header .co{color:var(--muted)}header .sp{flex:1}
nav{display:flex;gap:4px;padding:8px 20px 0;background:var(--card);border-bottom:1px solid var(--line);flex-wrap:wrap}
nav button{border:0;background:none;color:var(--muted);padding:9px 14px;cursor:pointer;border-bottom:3px solid transparent;font:inherit}
nav button.on{color:var(--brand);border-color:var(--brand);font-weight:600}
main{padding:16px 20px;max-width:1300px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:14px}
.card h3{margin:0 0 10px;font-size:15px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;align-items:end}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(420px,1fr));gap:14px}
label{display:block;font-size:12px;color:var(--muted);margin-bottom:3px}
input,select{width:100%;padding:7px 9px;border:1px solid var(--line);border-radius:7px;background:var(--bg);color:var(--ink);font:inherit}
a.b,button.b{display:inline-block;padding:7px 14px;border:1px solid var(--line);border-radius:7px;background:var(--card);color:var(--ink);cursor:pointer;font:inherit}
button.p,a.p{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
button.d{color:var(--bad)}button:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
.tw{overflow:auto;max-height:420px;border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%}
th,td{padding:6px 9px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{position:sticky;top:0;background:var(--card);font-size:12px;color:var(--muted)}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
tr.muted td{color:var(--muted)}tr.warn td{background:var(--warn)}tr.bold td{font-weight:700}
.msg{padding:8px 10px;border-radius:7px;margin-top:8px}
#toast{position:fixed;right:18px;bottom:18px;max-width:440px;padding:11px 15px;border-radius:9px;color:#fff;background:var(--good);display:none;white-space:pre-wrap;z-index:9}
#toast.bad{background:var(--bad)}
.picker{max-width:560px;margin:50px auto}.picker li{list-style:none}
.co-btn{display:block;width:100%;text-align:left;margin:6px 0;padding:11px 14px}
.muted{color:var(--muted)}.bad{color:var(--bad)}.red{color:var(--bad)!important;font-weight:700}
#pv{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:20;display:none;padding:2vh 3vw}
#pv .box{background:var(--card);height:96vh;max-width:1100px;margin:0 auto;border-radius:10px;display:flex;flex-direction:column;overflow:hidden}
#pv iframe{flex:1;border:0;width:100%;background:#fff}
.rv-grid{display:block}
.rv-grid>div{min-width:0}
.rv-img{position:sticky;top:0;z-index:6;max-height:38vh;overflow:auto;border:1px solid var(--line);border-radius:8px;background:#fff;margin:0 0 10px;box-shadow:0 4px 12px rgba(0,0,0,.12)}
.rv-img img{width:100%;display:block}
.hl{position:absolute;left:0;right:0;display:none;background:rgba(255,190,0,.28);border-top:2px solid #f0a000;border-bottom:2px solid #f0a000;pointer-events:none}
.rvt input,.rvt select{padding:4px 6px;font-size:13px}
.rvt tr.sel td{background:rgba(31,111,235,.12)}
.rvt tr.bad-row td{background:rgba(198,40,40,.10)}
.rvt tr.dirty td:first-child{box-shadow:inset 3px 0 0 #f0a000}
.rvt td.chk{white-space:normal;min-width:200px;font-size:12px}
.rvt td.chk .b{padding:2px 8px;margin:2px 0;font-size:12px}
@media(max-width:900px){.rv-img{max-height:30vh}}.ok{color:var(--good)}ul.w{margin:6px 0 0 18px;padding:0}ul.w li{margin:3px 0}textarea{width:100%;padding:7px 9px;border:1px solid var(--line);border-radius:7px;background:var(--bg);color:var(--ink);font:inherit;min-height:60px}.tot{font-weight:600}
.drop{border:2px dashed var(--line);border-radius:10px;padding:18px;text-align:center;color:var(--muted)}
.drop.over{border-color:var(--brand);background:var(--bg)}
</style>
</head>
<body>
<header><h1>EasyTally</h1><span class="co" id="co"></span><span class="sp"></span>
  <span id="who" class="muted"></span>
  <button class="b" id="pw" style="display:none" onclick="changePassword()">Change password</button>
  <button class="b" id="logout" style="display:none" onclick="logout()">Sign out</button>
  <button class="b" id="switch" style="display:none" onclick="switchCompany()">Switch company</button>
  <button class="b" onclick="quit()">Quit</button></header>
<nav id="nav" style="display:none"></nav>
<main id="main"></main>
<div id="toast"></div>
<div id="pv"></div>
<script>
"use strict";
const $=(s,e=document)=>e.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const today=()=>new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
const fyStart=()=>{const d=new Date();const y=d.getMonth()>=3?d.getFullYear():d.getFullYear()-1;return y+"-04-01"};
let META={}, TAB="masters", ME=null;
const ROLE={admin:["read","write","delete","admin"],accountant:["read","write","delete"],viewer:["read"]};
const can=p=>!!ME&&ROLE[ME.role].includes(p);
const TABS=[["masters","Masters"],["vouchers","Vouchers"],["invoices","Invoices (GST)"],["bank","Bank Statements"],["reports","Reports & GST"],["admin","Admin"]];

async function api(path,body,raw){
  const o={headers:{"X-EasyTally":"1"}};
  if(raw!==undefined){o.method="POST";o.body=raw;o.headers["Content-Type"]="application/octet-stream"}
  else if(body!==undefined){o.method="POST";o.headers["Content-Type"]="application/json";o.body=JSON.stringify(body)}
  const r=await fetch(path,o);let j;try{j=await r.json()}catch{j={error:"Unexpected response"}}
  if(r.status===401&&!path.startsWith("/api/auth/")){ME=null;boot();throw new Error(j.error||"Please sign in.")}
  if(!r.ok){const e=new Error(j.error||r.statusText);e.data=j;e.status=r.status;throw e}return j;
}
let tt;function toast(m,bad){const t=$("#toast");t.textContent=m;t.className=bad?"bad":"";t.style.display="block";clearTimeout(tt);tt=setTimeout(()=>t.style.display="none",bad?7000:3500)}
const guard=fn=>async(...a)=>{try{return await fn(...a)}catch(e){toast(e.message,true)}};
const opts=(l,v,t,sel,blank)=>(blank?`<option value="">${esc(blank)}</option>`:"")+l.map(x=>`<option value="${esc(x[v])}"${String(x[v])===String(sel)?" selected":""}>${esc(x[t])}</option>`).join("");
const sopts=(l,sel)=>l.map(x=>`<option${x===sel?" selected":""}>${esc(x)}</option>`).join("");
const stateOpts=sel=>`<option value="">(not set)</option>`+META.states.map(s=>`<option value="${s.code}"${s.code===sel?" selected":""}>${s.code} - ${esc(s.name)}</option>`).join("");
const table=(cols,rows,numCols=[])=>`<div class="tw"><table><thead><tr>${cols.map((c,i)=>`<th class="${numCols.includes(i)?"n":""}">${esc(c)}</th>`).join("")}</tr></thead><tbody>${rows.join("")||`<tr><td colspan="${cols.length}" class="muted">Nothing here yet.</td></tr>`}</tbody></table></div>`;
const delBtn=(fn,id)=>can("delete")?`<button class="b d" onclick="${fn}(${id})">Delete</button>`:"";

/* ---------- sign in / start ---------- */
async function boot(){
  const st=await api("/api/auth/status");
  META=await api("/api/meta");
  ["pw","logout","switch"].forEach(i=>$("#"+i).style.display="none");$("#nav").style.display="none";$("#who").textContent="";$("#co").textContent="";
  if(st.setup_needed)return setupScreen();
  if(!st.user)return loginScreen();
  ME=st.user;$("#who").textContent=`${ME.username} (${ME.role})`;$("#pw").style.display="";$("#logout").style.display="";
  await start();
}
function authCard(title,sub,fields,btn,fn){
  $("#main").innerHTML=`<div class="picker card"><h3>${title}</h3><p class="muted">${sub}</p>${fields}<div class="row"><button class="b p" id="go">${btn}</button></div></div>`;
  $("#go").onclick=guard(fn);$("#main").onkeydown=e=>{if(e.key==="Enter")$("#go").click()};
  const f=$("#main input");if(f)f.focus();
}
const loginScreen=()=>authCard("Sign in","Use your EasyTally account.",`<label>Username</label><input id="au" autocomplete="username"><label style="margin-top:8px">Password</label><input id="ap" type="password" autocomplete="current-password">`,"Sign in",async()=>{await api("/api/auth/login",{username:$("#au").value,password:$("#ap").value});await boot()});
const setupScreen=()=>authCard("Welcome to EasyTally","Create the administrator account. You can add accountants and viewers later (Admin tab). Use at least 8 characters for the password.",`<label>Username</label><input id="au" autocomplete="username"><label style="margin-top:8px">Password</label><input id="ap" type="password" autocomplete="new-password"><label style="margin-top:8px">Repeat password</label><input id="ap2" type="password" autocomplete="new-password">`,"Create administrator",async()=>{if($("#ap").value!==$("#ap2").value)throw new Error("The two passwords do not match.");await api("/api/auth/setup",{username:$("#au").value,password:$("#ap").value});await boot()});
const logout=guard(async()=>{await api("/api/auth/logout",{});ME=null;resetState();await boot()});
const changePassword=guard(async()=>{const o=prompt("Current password:");if(o===null)return;const n=prompt("New password (at least 8 characters):");if(n===null)return;await api("/api/auth/password",{old:o,new:n});toast("Password changed")});

async function start(){
  META=await api("/api/meta");
  $("#co").textContent=META.company?"— "+META.company:"";
  $("#switch").style.display=META.company?"":"none";
  $("#nav").style.display=META.company?"":"none";
  if(!META.company)return picker();
  const tabs=TABS.filter(([k])=>k!=="admin"||can("admin"));
  if(!tabs.find(t=>t[0]===TAB))TAB="masters";
  $("#nav").innerHTML=tabs.map(([k,t])=>`<button class="${k===TAB?"on":""}" onclick="go('${k}')">${t}</button>`).join("");
  await show();
}
async function picker(){
  const cs=await api("/api/companies");
  $("#main").innerHTML=`<div class="picker card"><h3>Select a customer company</h3>
   ${cs.map(c=>`<button class="b co-btn" onclick="openCo('${esc(c.slug)}')">${esc(c.name)}</button>`).join("")||`<p class="muted">No companies yet.${can("admin")?" Create the first one below.":" Ask an administrator to create one."}</p>`}
   ${can("admin")?`<hr style="border:0;border-top:1px solid var(--line);margin:14px 0"><h3>New company</h3>
   <div class="grid"><div><label>Company name</label><input id="cn"></div>
   <div><label>State</label><select id="cs">${stateOpts("")}</select></div>
   <div><label>GSTIN (needed for GST invoices)</label><input id="cg" placeholder="e.g. 27ABCDE1234F1Z5"></div></div>
   <p class="muted" style="margin:6px 0 0">The first two digits of a GSTIN are the state code, so the state is filled in from it. Every new company starts with the GST ledgers ready: <b>Output / Input CGST, SGST and IGST</b> (under Duties &amp; Taxes), plus Sales and Purchase.</p>
   <div class="row"><button class="b p" onclick="newCo()">Create & open</button></div>
   <hr style="border:0;border-top:1px solid var(--line);margin:14px 0"><h3>Restore from backup</h3>
   <div class="row"><input type="file" id="rf" accept=".zip,.db" style="width:auto"><button class="b" onclick="restoreFile('rf')">Restore</button></div>`:""}</div>`;
}
// Anything half-finished belongs to one company: never carry it into another one.
function resetState(){VL=[];IL=[];VEDIT=null;IEDIT=null;BANK="";RV=null;RQ.ledger="";RL=[]}
const openCo=guard(async s=>{await api("/api/company/open",{slug:s});resetState();await start()});
const newCo=guard(async()=>{await api("/api/company/create",{name:$("#cn").value,state:$("#cs").value,gstin:$("#cg").value});resetState();await start();toast("Company created. GST ledgers (Output / Input CGST, SGST, IGST) are ready under Duties & Taxes.")});
const switchCompany=guard(async()=>{await api("/api/company/close",{});resetState();await start()});
const quit=async()=>{if(!confirm("Quit EasyTally? Your data is saved."))return;try{await api("/api/shutdown",{})}catch{}document.body.innerHTML='<p style="padding:40px">EasyTally has stopped. You can close this tab. Start it again from the Start menu.</p>'};
function go(t){TAB=t;start()}
const show=guard(async()=>{await({masters,vouchers,invoices,bank,reports,admin}[TAB])()});

const KIND_LABEL={"Sales":"Tax Invoice (GST Sale)","Purchase":"Purchase","Credit Note":"Credit Note","Debit Note":"Debit Note"};
// GST % choices: the current slabs, plus the item's own older rate if it still carries one (shown as "(old)").
const rateList=cur=>[...new Set([...META.gst_rates,Number(cur)])].filter(x=>!isNaN(x)).sort((a,b)=>a-b);
const rateOpts=(cur)=>rateList(cur).map(r=>`<option value="${r}"${r===Number(cur)?" selected":""}>${r}%${META.gst_rates.includes(r)?"":" (old)"}</option>`).join("");

/* ---------- invoice print preview ---------- */
function invPreview(id){
  const src=`/api/invoice.pdf?id=${id}`,view=`/api/invoice.html?id=${id}`;
  $("#pv").innerHTML=`<div class="box"><div class="row" style="margin:0;padding:10px 14px;border-bottom:1px solid var(--line)"><h3 style="margin:0">Print preview</h3><span class="sp" style="flex:1"></span>
   <button class="b p" onclick="pvPrint()">Print</button><a class="b" href="${src}&download=1">Download PDF</a><a class="b" href="${src}" target="_blank">Open PDF</a><button class="b" onclick="pvClose()">Close</button></div>
   <iframe id="pvf" src="${view}" title="Invoice preview"></iframe></div>`;
  $("#pv").style.display="block";document.addEventListener("keydown",pvEsc);
}
function pvPrint(){const f=$("#pvf");try{f.contentWindow.focus();f.contentWindow.print()}catch(e){window.open(f.src,"_blank")}}   // prints only the invoice
function pvClose(){$("#pv").style.display="none";$("#pv").innerHTML="";document.removeEventListener("keydown",pvEsc)}
const pvEsc=e=>{if(e.key==="Escape")pvClose()};

/* ---------- masters ---------- */
async function masters(){
  const [L,I]=await Promise.all([api("/api/ledgers"),api("/api/items")]);
  const W=can("write");
  $("#main").innerHTML=`<div class="two">
  <div class="card"><h3>Ledgers</h3>
   ${W?`<div class="grid"><div><label>Name</label><input id="ln"></div>
   <div><label>Under group</label><select id="lg">${sopts(META.groups,"Sundry Debtors")}</select></div>
   <div><label>Opening balance</label><input id="lo" value="0" inputmode="decimal"></div>
   <div><label>Dr / Cr</label><select id="ls"><option>Dr</option><option>Cr</option></select></div>
   <div><label>GSTIN</label><input id="lt"></div><div><label>State (GST)</label><select id="lst">${stateOpts("")}</select></div></div>
   <div class="row"><button class="b p" onclick="addLedger()">Add ledger</button></div><br>`:""}
   ${table(["Name","Group","Opening","GSTIN",""],L.map(l=>`<tr><td>${esc(l.name)}</td><td>${esc(l.group)}</td><td class="n">${esc(l.opening)}</td><td>${esc(l.gstin)}</td><td>${delBtn("delLedger",l.id)}</td></tr>`),[2])}</div>
  <div class="card"><h3>Stock items</h3>
   ${W?`<div class="grid"><div><label>Item name</label><input id="in"></div><div><label>Unit</label><input id="iu" value="Nos"></div>
   <div><label>HSN / SAC</label><input id="ih"></div><div><label>GST %</label><select id="ir">${sopts(META.gst_rates.map(String),"18")}</select></div>
   <div><label>Opening qty</label><input id="iq" value="0"></div><div><label>Opening value</label><input id="iv" value="0"></div></div>
   <div class="row"><button class="b p" onclick="addItem()">Add item</button></div><br>`:""}
   ${table(["Item","Unit","HSN","GST %","Open qty","Open value",""],I.map(i=>`<tr><td>${esc(i.name)}</td><td>${esc(i.unit)}</td><td>${esc(i.hsn)}</td><td>${W?`<select style="width:auto" onchange="setItemRate(${i.id},this.value)">${rateOpts(i.gst_rate)}</select>`:i.gst_rate+"%"}</td><td class="n">${i.opening_qty}</td><td class="n">${i.opening_value}</td><td>${delBtn("delItem",i.id)}</td></tr>`),[4,5])}</div></div>`;
}
const addLedger=guard(async()=>{await api("/api/ledgers",{name:$("#ln").value,group:$("#lg").value,opening:$("#lo").value,side:$("#ls").value,gstin:$("#lt").value,state:$("#lst").value});toast("Ledger added");masters()});
const delLedger=guard(async id=>{await api("/api/ledgers/delete",{id});masters()});
const addItem=guard(async()=>{await api("/api/items",{name:$("#in").value,unit:$("#iu").value,hsn:$("#ih").value,gst_rate:$("#ir").value,opening_qty:$("#iq").value,opening_value:$("#iv").value});toast("Item added");masters()});
const setItemRate=guard(async(id,r)=>{await api("/api/items/update",{id,gst_rate:r});toast(`GST rate set to ${r}% for new invoices (saved invoices keep theirs)`);masters()});
const delItem=guard(async id=>{await api("/api/items/delete",{id});masters()});

/* ---------- cash limits ---------- */
const CASH="Cash-in-Hand", OWN=["Bank Accounts","Cash-in-Hand"];
const inr=n=>Number(n).toLocaleString("en-IN",{minimumFractionDigits:2,maximumFractionDigits:2});
// Live check of the lines being typed. (The server also adds up same-day totals to one person when saving.)
function cashCheck(lines){
  const cl=META.cash_limits;const res={flags:lines.map(()=>false),msgs:[]};
  if(!cl||cl.mode==="off")return res;
  const others=lines.filter(l=>l.group!==CASH);
  if(!lines.some(l=>l.group===CASH)||others.every(l=>OWN.includes(l.group)))return res;     // own cash/bank transfer
  const who=others.map(l=>l.name).join(", ");
  lines.forEach((l,i)=>{
    if(l.group!==CASH)return;const amt=paise(l.amount)/100;
    const rec=l.side==="Dr",limit=rec?cl.receipt:cl.payment;
    if(limit>0&&amt>limit){res.flags[i]=true;res.msgs.push(`Cash ${rec?"receipt":"payment"} of ${inr(amt)} ${rec?"from":"to"} ${who} is above the limit of ${inr(limit)}`+(rec?" (Sec 269ST)":" (Sec 40A(3))"))}
  });
  return res;
}
const cashNote=()=>{const c=META.cash_limits;return c&&c.mode!=="off"?`Cash limits: payments above ₹${inr(c.payment)}, receipts above ₹${inr(c.receipt)} are shown in red (${c.mode==="block"?"entries are blocked":"you will be asked to confirm"}).`:""};

/* ---------- vouchers ---------- */
let VL=[], LEDG=[], VEDIT=null;
const paise=s=>Math.round(parseFloat(String(s).replace(/,/g,""))*100)||0;
const money=p=>(p/100).toLocaleString("en-IN",{minimumFractionDigits:2,maximumFractionDigits:2});
async function vouchers(){
  const [V,L]=await Promise.all([api("/api/vouchers"),api("/api/ledgers")]);LEDG=L;
  const W=can("write");
  $("#main").innerHTML=`${W?`<div class="card"><h3>${VEDIT?"Edit voucher":"New voucher"}</h3>
   <div class="grid"><div><label>Type</label><select id="vt" ${VEDIT?"disabled":""}>${sopts(META.vtypes,"Payment")}</select></div>
   <div><label>Date</label><input type="date" id="vd" value="${today()}"></div>
   <div style="grid-column:span 2"><label>Narration</label><input id="vn"></div><div><label>Ref / cheque no.</label><input id="vr"></div></div>
   <div class="grid" style="margin-top:10px"><div style="grid-column:span 2"><label>Ledger</label><select id="vl">${opts(L,"id","name","","Select ledger…")}</select></div>
   <div><label>Dr / Cr</label><select id="vs"><option>Dr</option><option>Cr</option></select></div>
   <div><label>Amount</label><input id="va" inputmode="decimal"></div><div><button class="b" onclick="vAdd()">Add line</button></div></div>
   <div id="vlines"></div><div id="vcash" class="bad" style="margin-top:6px"></div>
   <div class="muted" style="font-size:12px;margin-top:4px">${esc(cashNote())}</div>
   <div class="row"><button class="b p" onclick="vSave()">${VEDIT?"Update voucher":"Save voucher"}</button><button class="b" onclick="VEDIT=null;VL=[];vouchers()">${VEDIT?"Cancel edit":"Clear"}</button><span id="vtot" class="tot"></span></div></div>`:""}
  <div class="card"><h3>Recent vouchers</h3>${table(["Date","Type","No.","Particulars","Amount","Narration",""],V.map(v=>`<tr><td>${v.date}</td><td>${v.vtype}</td><td>${v.number}</td><td>${esc(v.particulars)}</td><td class="n${v.cash_over?" red":""}"${v.cash_over?` title="${esc(v.cash_note)}"`:""}>${v.amount}${v.cash_over?" ⚠ cash limit":""}</td><td>${esc(v.narration)}</td><td>${W?(v.invoice?`<button class="b" onclick="iEdit(${v.id})">Edit invoice</button>`:`<button class="b" onclick="vEdit(${v.id})">Edit</button>`):""} ${delBtn("vDel",v.id)}</td></tr>`),[4])}</div>`;
  if(W)vRender();
}
function vRender(){
  const dr=VL.filter(l=>l.side==="Dr").reduce((a,l)=>a+paise(l.amount),0),cr=VL.filter(l=>l.side==="Cr").reduce((a,l)=>a+paise(l.amount),0);
  const cc=cashCheck(VL);

const sumLine=R=>{
  const bits=[];
  if(R.opening!==null)bits.push(`Opening ${inr(R.opening)}${R.opening_inferred?" (taken from the first row)":""} + credits ${inr(R.credit_total)} − debits ${inr(R.debit_total)} = <b>${inr(R.closing_computed)}</b>`);
  if(R.closing_stated!==null){const d=Number(R.closing_diff);bits.push(d===0?`<span class="ok">✓ matches the statement's closing balance ${inr(R.closing_stated)}</span>`:`<span class="red">✗ statement closing is ${inr(R.closing_stated)}, differs by ${inr(Math.abs(d))}</span>`)}
  return bits.join(" &nbsp;·&nbsp; ")+`<br>Row checks: <span class="ok">${R.ok} add up</span> · <span class="${R.bad?"red":""}">${R.bad} do not</span> · ${R.unchecked} unchecked`;
};
function rvCheck(t,rec,prevId){
  const h=[];
  if(t.source==="ocr")h.push(`<span class="${t.confidence<0.8?"red":"muted"}">OCR confidence ${pct(t.confidence)}</span>`);
  if(t.source==="manual")h.push(`<span class="muted">added by hand</span>`);
  if(rec&&rec.ok===true)h.push(`<span class="ok">✓ balance adds up</span>`);
  if(rec&&rec.ok===false){
    h.push(`<span class="red">✗ balance should be ${inr(rec.expected)}</span>`);
    if(rec.fix_amount)h.push(`<button class="b" onclick="rvUseAmount(${t.id},'${rec.fix_amount.side}','${rec.fix_amount.amount}',event)">Amount is ${inr(rec.fix_amount.amount)} ${rec.fix_amount.side}</button>`);
    h.push(`<button class="b" onclick="rvUseBalance(${t.id},'${rec.expected}',event)">Balance is ${inr(rec.expected)}</button>`);
    if(rec.missing_row)h.push(`<button class="b" onclick="rvInsertMissing(${prevId||0},${t.id},'${rec.missing_row.side}','${rec.missing_row.amount}',event)">A ${rec.missing_row.side} of ${inr(rec.missing_row.amount)} is missing above</button>`);
  }
  if(t.note&&t.source==="ocr")h.push(`<span class="muted">${esc(t.note)}</span>`);
  return h.join("<br>");
}
function rvRow(t,i,rec,prevId){
  const lock=t.posted||!can("write"),dis=lock?"disabled":"",bad=rec&&rec.ok===false;
  const inp=(f,v,extra="")=>`<input data-f="${f}" value="${esc(v)}" ${dis} ${extra}>`;
  return `<tr id="rv${t.id}" class="${t.posted?"muted":bad?"bad-row":""}${RV.sel===t.id?" sel":""}" onclick="reviewSelect(${t.id})">
   <td><input type="checkbox" ${t.verified||t.posted?"checked":""} ${dis} title="Verified" onclick="event.stopPropagation()" onchange="rvToggle(${t.id},this.checked)"></td><td>${i+1}</td>
   <td><input type="date" data-f="date" value="${t.date_iso}" ${dis}></td><td>${inp("narration",t.narration,'style="min-width:230px"')}</td>
   <td>${inp("debit",t.debit_val,'inputmode="decimal" style="width:96px"')}</td><td>${inp("credit",t.credit_val,'inputmode="decimal" style="width:96px"')}</td>
   <td>${inp("balance",t.balance_val,'inputmode="decimal" style="width:104px"')}</td>
   <td><select ${dis} onclick="event.stopPropagation()" onchange="rvLedger(${t.id},this.value)" style="max-width:150px">${opts(ALL,"id","name",t.ledger_id,"— ledger —")}</select></td>
   <td class="chk">${rvCheck(t,rec,prevId)}</td>
   <td style="white-space:nowrap">${lock?(t.posted?"posted":""):`<button class="b p" onclick="rvSave(${t.id},event)">Save ✓</button> <button class="b" title="Add a missing row below this one" onclick="rvAddAfter(${t.id},event)">＋</button> <button class="b d" title="Delete this row (for lines the OCR invented)" onclick="rvDelete(${t.id},event)">✕</button>`}</td></tr>`;
}
async function reviewLoad(){
  if(!RV)return;
  const [T,R,I]=await Promise.all([api(`/api/bank/txns?bank_id=${BANK}&import_id=${RV.imp}&posted=1`),api("/api/bank/reconcile?import_id="+RV.imp),api("/api/bank/imports?bank_id="+BANK)]);
  RV.T=T;RV.R=R;RV.meta=I.find(i=>i.id===RV.imp)||RV.meta;
  if(!RV.sel||!T.find(x=>x.id===RV.sel)){const f=T.find(x=>!x.verified&&!x.posted)||T[0];RV.sel=f?f.id:null}
  const rec={};R.rows.forEach(r=>rec[r.id]=r);
  const done=T.filter(t=>t.verified||t.posted).length,W=can("write");
  $("#rvcount").textContent=`${done} of ${T.length} rows verified`;
  $("#rvbody").innerHTML=`<div id="rvnav" class="row" style="margin:0 0 8px"></div>
   ${W?`<div class="row" style="margin:0 0 8px"><label style="margin:0">Opening balance on the statement</label><input id="rvo" value="${esc(RV.meta.opening)}" style="width:130px" inputmode="decimal">
    <label style="margin:0">Closing balance</label><input id="rvc" value="${esc(RV.meta.closing)}" style="width:130px" inputmode="decimal"><button class="b" onclick="rvBalances()">Save balances</button></div>`:""}
   <div class="msg" style="background:var(--bg);margin:0 0 8px">${sumLine(R)}</div>
   ${W?`<div class="row" style="margin:0 0 8px"><button class="b p" onclick="rvVerifyOk()" title="Marks every row whose running balance adds up">Verify all rows that add up</button>
    <button class="b" onclick="rvVerifyAll()">Verify all remaining…</button><button class="b" onclick="rvPost()">Post verified rows</button></div>`:""}
   <div class="tw rvt" style="max-height:none"><table><thead><tr><th>✓</th><th>#</th><th>Date</th><th>Narration</th><th>Debit</th><th>Credit</th><th>Balance</th><th>Ledger</th><th>Check</th><th></th></tr></thead>
   <tbody>${T.map((t,i)=>rvRow(t,i,rec[t.id],i?T[i-1].id:0)).join("")||'<tr><td colspan="10" class="muted">No rows.</td></tr>'}</tbody></table></div>`;
  document.querySelectorAll("#rvbody tr[id^=rv] input[data-f]").forEach(el=>el.addEventListener("input",()=>el.closest("tr").classList.add("dirty")));
  document.querySelectorAll("#rvbody tr[id^=rv] input[data-f]").forEach(el=>el.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();rvSave(Number(el.closest("tr").id.slice(2)))}}));
  rvNav();rvHighlight();
}
const rowVals=id=>{const tr=$("#rv"+id),g=f=>tr.querySelector(`[data-f="${f}"]`).value;return{id,date:g("date"),narration:g("narration"),debit:g("debit"),credit:g("credit"),balance:g("balance")}};
const refresh=async()=>{await reviewLoad();bankRows();bankImports()};
const rvSave=guard(async(id,ev)=>{if(ev)ev.stopPropagation();await api("/api/bank/update_txn",rowVals(id));toast("Row saved and verified");RV.sel=id;await refresh()});
const rvToggle=guard(async(id,on)=>{
  if($("#rv"+id).classList.contains("dirty")){await rvSave(id);return}            // unsaved edits: save them, then verify
  await api("/api/bank/verify",{ids:[id],verified:on});await refresh();
});
const rvLedger=guard(async(id,lid)=>{await api("/api/bank/set_ledger",{ids:[id],ledger_id:lid||null});bankRows()});
const rvDelete=guard(async(id,ev)=>{ev.stopPropagation();if(!confirm("Delete this row? Use this for lines the OCR invented, such as headings or footers."))return;await api("/api/bank/delete_txn",{ids:[id]});await refresh()});
function rvUseAmount(id,side,amount,ev){ev.stopPropagation();const tr=$("#rv"+id);tr.querySelector('[data-f="debit"]').value=side==="debit"?amount:"";tr.querySelector('[data-f="credit"]').value=side==="credit"?amount:"";tr.classList.add("dirty")}
function rvUseBalance(id,bal,ev){ev.stopPropagation();const tr=$("#rv"+id);tr.querySelector('[data-f="balance"]').value=bal;tr.classList.add("dirty")}
const rvInsertMissing=guard(async(prevId,curId,side,amount,ev)=>{
  ev.stopPropagation();const cur=rowVals(prevId||curId);                     // dates run forwards: start from the row above
  const r=await api("/api/bank/add_txn",{import_id:RV.imp,after_id:prevId||null,date:cur.date,narration:"(missing row: fill in from the page)",
    debit:side==="debit"?amount:"",credit:side==="credit"?amount:"",balance:"",verify:false});
  RV.sel=r.id;await refresh();toast("Row inserted. Fill in its date and narration from the page, then press Save ✓");
});
const rvAddAfter=guard(async(id,ev)=>{
  ev.stopPropagation();const a=prompt("Amount of the missing row. Type D (debit) or C (credit) then the amount, e.g.  D 5000","");if(a===null)return;
  const m=/^\s*([DC])\s*([\d,]+(?:\.\d{1,2})?)\s*$/i.exec(a);if(!m)throw new Error("Type D or C followed by the amount, e.g. D 5000");
  const d=m[1].toUpperCase()==="D",amt=m[2].replace(/,/g,"");
  const r=await api("/api/bank/add_txn",{import_id:RV.imp,after_id:id,date:rowVals(id).date,narration:"(missing row: fill in from the page)",debit:d?amt:"",credit:d?"":amt,balance:"",verify:false});
  RV.sel=r.id;await refresh();
});
const rvBalances=guard(async()=>{await api("/api/bank/balances",{import_id:RV.imp,opening:$("#rvo").value,closing:$("#rvc").value});await refresh()});
const rvVerifyOk=guard(async()=>{const r=await api("/api/bank/verify_reconciled",{import_id:RV.imp});toast(`${r.verified} row(s) whose balance adds up were verified`);await refresh()});
const rvVerifyAll=guard(async()=>{
  const ids=RV.T.filter(t=>!t.verified&&!t.posted).map(t=>t.id);if(!ids.length)return toast("Every row is already verified");
  if(!confirm(`Mark all ${ids.length} remaining row(s) as verified?\n\nOnly do this if you have compared every one with the page.`))return;
  await api("/api/bank/verify",{ids,verified:true});await refresh();
});
const rvPost=guard(async()=>{
  const r=await api("/api/bank/post",{all_for_bank:BANK});
  toast(`Posted ${r.posted} verified voucher(s).${r.unverified?` ${r.unverified} unverified row(s) held back.`:""} ${r.skipped-r.unverified>0?`${r.skipped-r.unverified} skipped (no ledger chosen).`:""}`);await refresh();
});

/* ---------- reports & GST returns ---------- */
let RQ={name:"Day Book",start:fyStart(),end:today(),ledger:""}, RL=[];
const NUMCOL=/^(Debit|Credit|Amount|Balance|Taxable|CGST|SGST|IGST|Value|Avg Cost|Closing Qty|Inward|Outward|Outstanding|Pending|Advance|0-30|31-60|61-90|Over 90|Limit|Age \(days\))$/;
async function reports(){
  RL=await api("/api/ledgers");
  const lastMonth=(()=>{const d=new Date();d.setDate(1);d.setMonth(d.getMonth()-1);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")})();
  $("#main").innerHTML=`<div class="card"><div class="grid"><div><label>Report</label><select id="rn">${sopts(META.reports,RQ.name)}</select></div>
   <div><label>From</label><input type="date" id="rs" value="${RQ.start}"></div><div><label>To / as on</label><input type="date" id="re" value="${RQ.end}"></div>
   <div><label>Ledger (Ledger Statement / Outstanding Bills)</label><select id="rl">${opts(RL,"id","name",RQ.ledger,"—")}</select></div>
   <div class="row" style="margin:0"><button class="b p" onclick="runReport()">Run</button><a class="b" id="csv" href="#">Export CSV</a></div></div></div><div id="rout"></div>
  <div class="card"><h3>GST returns (GSTR-1 and GSTR-3B)</h3>
   <div class="grid"><div><label>Month</label><input type="month" id="gm" value="${lastMonth}"></div>
   <div class="row" style="margin:0"><button class="b p" onclick="gstCheck()">Check &amp; preview</button></div></div>
   <div id="gout"></div></div>`;
  runReport(true);
}
const runReport=guard(async(quiet)=>{
  RQ={name:$("#rn").value,start:$("#rs").value,end:$("#re").value,ledger:$("#rl").value};
  const qs=new URLSearchParams({name:RQ.name,start:RQ.start,end:RQ.end,ledger_id:RQ.ledger}).toString();
  $("#csv").href="/api/report.csv?"+qs;
  if(quiet===true&&!RQ.ledger&&(RQ.name==="Ledger Statement"||RQ.name==="Outstanding Bills")){
    $("#rout").innerHTML=`<div class="card muted">Choose a customer or supplier ledger above, then press Run.</div>`;return}
  let r;
  try{r=await api("/api/report?"+qs)}
  catch(e){if(quiet===true){$("#rout").innerHTML=`<div class="card muted">${esc(e.message)}</div>`;return}throw e}
  const num=r.columns.map((c,i)=>NUMCOL.test(c)?i:-1).filter(i=>i>=0);
  $("#rout").innerHTML=`<div class="card"><h3>${esc(r.title)}</h3>${table(r.columns,r.rows.map((x,ri)=>{const red=(r.red||[])[ri]||[];return `<tr class="${/^(TOTAL|NET|Total|Closing Balance|[A-Z &]+$)/.test(x[0])&&x[0]?"bold":""}">${x.map((c,i)=>`<td class="${num.includes(i)?"n":""}${red.includes(i)?" red":""}">${esc(c)}</td>`).join("")}</tr>`}),num)}</div>`;
});
const gstCheck=guard(async()=>{
  const m=$("#gm").value;if(!m)throw new Error("Choose a month");
  const r=await api("/api/gst/check?month="+m),c=r.counts,t=r.gstr3b;
  $("#gout").innerHTML=`<p style="margin-top:12px"><b>GSTR-1:</b> ${c.b2b_invoices} B2B invoice(s), ${c.b2cl_invoices} B2C-large, ${c.b2cs_rows} B2C-small row(s), ${c.credit_notes} credit note(s), ${c.hsn_rows} HSN row(s).<br>
   <b>GSTR-3B:</b> outward taxable ${esc(t.taxable.toFixed(2))}; output IGST ${t.igst.toFixed(2)}, CGST ${t.cgst.toFixed(2)}, SGST ${t.sgst.toFixed(2)}; ITC IGST ${t.itc.iamt.toFixed(2)}, CGST ${t.itc.camt.toFixed(2)}, SGST ${t.itc.samt.toFixed(2)}.</p>
   ${r.warnings.length?`<div class="msg" style="background:var(--warn)"><b>Check before filing</b><ul class="w">${r.warnings.map(w=>`<li>${esc(w)}</li>`).join("")}</ul></div>`:""}
   <div class="row"><a class="b p" href="/api/gst/gstr1.json?month=${m}">GSTR-1 JSON</a><a class="b" href="/api/gst/gstr1.xlsx?month=${m}">GSTR-1 Excel</a>
   <a class="b p" href="/api/gst/gstr3b.json?month=${m}">GSTR-3B JSON</a><a class="b" href="/api/gst/gstr3b.xlsx?month=${m}">GSTR-3B Excel</a></div>
   <p class="muted">Validate the JSON in the GST offline tool or portal before filing; the portal format can change.</p>`;
});

/* ---------- admin ---------- */
async function admin(){
  const [S,U,A]=await Promise.all([api("/api/settings"),api("/api/users"),api("/api/audit")]);
  const f=(id,label,v,span)=>`<div${span?` style="grid-column:span ${span}"`:""}><label>${label}</label><input id="${id}" value="${esc(v)}"></div>`;
  $("#main").innerHTML=`<div class="card"><h3>Company details <span class="muted">(printed on invoices, used in GST returns)</span></h3>
   <div class="grid">${f("sn","Company name",S.name,2)}${f("sa","Address",S.address,2)}${f("sp","Phone",S.phone)}${f("se","Email",S.email)}
   <div><label>State</label><select id="ss">${stateOpts(S.state)}</select></div>${f("sg","GSTIN",S.gstin)}${f("sx","PAN",S.pan)}</div>
   <h3 style="margin:16px 0 6px">Cash limits <span class="muted">(entries above these are flagged in red)</span></h3>
   <div class="grid">${f("scp","Cash payment limit (₹) — Sec 40A(3): 10,000",S.cash_payment_limit||META.cash_limits.payment)}
   ${f("scr","Cash receipt limit (₹) — Sec 269ST: 2,00,000 or more",S.cash_receipt_limit||META.cash_limits.receipt)}
   <div><label>When a limit is exceeded</label><select id="scm"><option value="warn"${META.cash_limits.mode==="warn"?" selected":""}>Warn and ask to confirm</option><option value="block"${META.cash_limits.mode==="block"?" selected":""}>Block the entry</option><option value="off"${META.cash_limits.mode==="off"?" selected":""}>Do not check</option></select></div></div>
   <p class="muted">A limit is exceeded when the amount is greater than it. Same-day cash entries with one person are added up. Cash moved between your own cash and bank accounts is not checked.</p>
   <div class="grid" style="margin-top:10px"><div style="grid-column:span 2"><label>Bank details for invoices</label><textarea id="sb">${esc(S.bank_details)}</textarea></div>
   <div style="grid-column:span 2"><label>Terms &amp; conditions</label><textarea id="st">${esc(S.terms)}</textarea></div></div>
   <div class="row"><button class="b p" onclick="saveSettings()">Save details</button></div></div>
  <div class="two"><div class="card"><h3>Users</h3>
   <div class="grid"><div><label>Username</label><input id="nu"></div><div><label>Password (8+)</label><input id="np" type="password"></div>
   <div><label>Role</label><select id="nr"><option>accountant</option><option>viewer</option><option>admin</option></select></div><div><button class="b p" onclick="addUser()">Add user</button></div></div><br>
   ${table(["User","Role","Active",""],U.map(u=>`<tr><td>${esc(u.username)}</td><td><select onchange="userUpd(${u.id},{role:this.value})">${sopts(["admin","accountant","viewer"],u.role)}</select></td>
    <td><input type="checkbox" style="width:auto" ${u.disabled?"":"checked"} onchange="userUpd(${u.id},{disabled:!this.checked})"></td>
    <td><button class="b" onclick="resetPw(${u.id})">Set password</button> <button class="b d" onclick="userDel(${u.id})">Delete</button></td></tr>`))}
   <p class="muted">Admin: everything. Accountant: enter, edit and delete data. Viewer: reports only. Forgot the admin password? Close EasyTally and delete <code>users.db</code> in your EasyTally folder: accounts reset, accounting data is untouched.</p></div>
  <div class="card"><h3>Backup &amp; restore</h3>
   <div class="row"><a class="b p" href="/api/backup">Download backup of this company</a><a class="b" href="/api/backup/all">Backup all companies</a></div>
   <p class="muted">Backups do not include user accounts. Keep a copy on a pen drive or cloud drive.</p>
   <div class="row"><input type="file" id="rf2" accept=".zip,.db" style="width:auto"><label style="display:inline;margin:0"><input type="checkbox" id="rov" style="width:auto"> replace existing company</label><button class="b" onclick="restoreFile('rf2')">Restore</button></div>
   <hr style="border:0;border-top:1px solid var(--line);margin:14px 0"><h3>Tally exchange</h3>
   <div class="row"><a class="b" href="/api/tally/masters.xml">Export masters (XML)</a><a class="b" href="/api/tally/vouchers.xml">Export vouchers (XML)</a></div>
   <div class="row"><input type="file" id="tf" accept=".xml" style="width:auto"><button class="b" onclick="tallyImport()">Import Tally XML</button></div>
   <p class="muted">Ledgers, opening balances and accounting vouchers only (no stock items or inventory). Import masters before vouchers. Importing the same file twice is safe.</p><div id="tout"></div></div></div>
  <div class="card"><h3>Audit trail <span class="muted">(latest 300 changes)</span></h3>${table(["Time","User","Action","Details"],A.map(a=>`<tr><td>${esc(a.time)}</td><td>${esc(a.user)}</td><td>${esc(a.action)}</td><td style="white-space:normal;max-width:620px">${esc(a.detail)}</td></tr>`))}</div>`;
}
const saveSettings=guard(async()=>{await api("/api/settings",{name:$("#sn").value,address:$("#sa").value,phone:$("#sp").value,email:$("#se").value,state:$("#ss").value,gstin:$("#sg").value,pan:$("#sx").value,cash_payment_limit:$("#scp").value,cash_receipt_limit:$("#scr").value,cash_limit_mode:$("#scm").value,bank_details:$("#sb").value,terms:$("#st").value});toast("Company details saved");start()});
const addUser=guard(async()=>{await api("/api/users",{username:$("#nu").value,password:$("#np").value,role:$("#nr").value});toast("User added");admin()});
const userUpd=guard(async(id,patch)=>{await api("/api/users/update",{id,...patch});toast("Updated");admin()});
const resetPw=guard(async id=>{const p=prompt("New password (at least 8 characters):");if(p===null)return;await api("/api/users/update",{id,password:p});toast("Password set")});
const userDel=guard(async id=>{if(confirm("Delete this user?")){await api("/api/users/delete",{id});admin()}});
const restoreFile=guard(async inputId=>{
  const f=$("#"+inputId).files[0];if(!f)throw new Error("Choose a backup file first");
  const ov=$("#rov")&&$("#rov").checked?1:0;
  if(ov&&!confirm("This replaces the existing company with the backup (the old file is kept as .bak). Continue?"))return;
  const r=await api("/api/restore?overwrite="+ov,undefined,await f.arrayBuffer());
  toast("Restored: "+r.restored.map(x=>x.name).join(", "));resetState();await start();
});
const tallyImport=guard(async()=>{
  const f=$("#tf").files[0];if(!f)throw new Error("Choose a Tally XML file first");
  const r=await api("/api/tally/import",undefined,await f.arrayBuffer());
  $("#tout").innerHTML=`<div class="msg" style="background:var(--bg)"><b>Imported:</b> ${r.groups} group(s), ${r.ledgers} ledger(s) (${r.ledgers_existing} already existed), ${r.vouchers} voucher(s); ${r.duplicates} duplicate(s) and ${r.skipped} skipped.
   ${r.warnings.length?`<ul class="w">${r.warnings.map(w=>`<li>${esc(w)}</li>`).join("")}</ul>`:""}</div>`;
});

boot().catch(e=>toast(e.message,true));
</script>
</body>
</html>
