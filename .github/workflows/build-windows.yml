name: Build Windows installer

on:
  workflow_dispatch:
  push:
    branches: [ "claude/**" ]
    paths: [ "easy_tally/**", ".github/workflows/build-windows.yml" ]
    tags: [ "v*" ]

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: easy_tally
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt reportlab pyinstaller
      - name: Run tests
        run: python -m unittest discover -s tests -t .
      - name: Build EasyTally.exe
        run: >
          python -m PyInstaller --noconfirm --clean --windowed --name EasyTally
          --collect-all pdfplumber --collect-all pdfminer --collect-all pypdfium2 --add-data "easytally/web/static;easytally/web/static" run.py
      - name: Smoke-test the built exe can import its parser
        shell: bash
        run: |
          ls dist/EasyTally/EasyTally.exe
          ls dist/EasyTally/_internal | head
      - name: Build installer
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) { choco install innosetup -y --no-progress }
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" }
          & $iscc installer\EasyTally.iss
      - uses: actions/upload-artifact@v4
        with:
          name: EasyTally-Setup
          path: easy_tally/dist-installer/EasyTally-Setup.exe
      - uses: actions/upload-artifact@v4
        with:
          name: EasyTally-portable
          path: easy_tally/dist/EasyTally
