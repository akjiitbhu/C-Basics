name: Build Windows installer

on:
  workflow_dispatch:
  push:
    branches: [ "claude/**" ]
    paths: [ "easy_tally/**", ".github/workflows/build-windows.yml" ]
    tags: [ "v*" ]

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: easy_tally
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pyinstaller
      - name: Run tests
        run: python -m unittest discover -s tests -t .
      - name: Build EasyTally.exe
        run: >
          python -m PyInstaller --noconfirm --clean --windowed --name EasyTally
          --collect-all pdfplumber --collect-all pdfminer --collect-all pypdfium2 --collect-all reportlab --collect-all openpyxl --collect-all rapidocr_onnxruntime --collect-all onnxruntime --collect-all shapely --collect-all pyclipper --add-data "easytally/web/static;easytally/web/static" run.py
      - name: Smoke-test the built exe in browser mode
        shell: pwsh
        run: |
          $base = "http://127.0.0.1:8765"
          $h = @{ "X-EasyTally" = "1" }
          $s = New-Object Microsoft.PowerShell.Commands.WebRequestSession
          function Call-Api($path, $obj) {
            Invoke-RestMethod "$base$path" -Method Post -Headers $h -ContentType "application/json" `
              -Body (ConvertTo-Json -Depth 6 -InputObject $obj) -WebSession $s
          }
          function Get-Bytes($path) { (Invoke-WebRequest "$base$path" -WebSession $s -UseBasicParsing).Content }
          $p = Start-Process dist\EasyTally\EasyTally.exe -ArgumentList "--web" -PassThru
          $ok = $false
          foreach ($i in 1..30) {
            Start-Sleep -Seconds 1
            try { $r = Invoke-RestMethod "$base/api/ping"; if ($r.app -eq "EasyTally") { $ok = $true; break } } catch {}
          }
          if (-not $ok) { throw "EasyTally --web did not start" }
          $page = (Invoke-WebRequest "$base/" -UseBasicParsing).Content
          if ($page -notmatch "EasyTally") { throw "UI page missing from bundle" }
          # nothing works before the first administrator exists, and everything works after sign-in
          try { Invoke-RestMethod "$base/api/ledgers" | Out-Null; throw "API open without sign-in" } catch { if ($_.Exception.Message -eq "API open without sign-in") { throw } }
          Call-Api "/api/auth/setup" @{ username = "ciadmin"; password = "ci-password-123" } | Out-Null
          Call-Api "/api/company/create" @{ name = "CI Smoke Co"; state = "27" } | Out-Null
          Call-Api "/api/settings" @{ gstin = "27ABCDE1234F1Z5"; address = "CI Street" } | Out-Null
          $item = Call-Api "/api/items" @{ name = "Widget"; hsn = "8501"; gst_rate = 18 }
          $cust = Call-Api "/api/ledgers" @{ name = "Cust"; group = "Sundry Debtors"; gstin = "29AAAAA0000A1Z5" }
          $inv = Call-Api "/api/invoices" @{ kind = "Sales"; date = "2026-04-05"; party_id = $cust.id; ref = "CI-1"; lines = @(@{ item_id = $item.id; qty = "2"; rate = "500" }) }
          # these exercise reportlab and openpyxl inside the frozen exe
          $pdf = Get-Bytes "/api/invoice.pdf?id=$($inv.id)"
          if ([System.Text.Encoding]::ASCII.GetString($pdf[0..3]) -ne "%PDF") { throw "invoice PDF not generated" }
          $xl = Get-Bytes "/api/gst/gstr1.xlsx?month=2026-04"
          if ([System.Text.Encoding]::ASCII.GetString($xl[0..1]) -ne "PK") { throw "GSTR-1 Excel not generated" }
          # PowerShell hands back XML as text (not bytes), so check it as a string
          $tm = (Invoke-WebRequest "$base/api/tally/masters.xml" -WebSession $s -UseBasicParsing).Content
          if ("$tm" -notmatch "<LEDGER ") { throw "Tally XML not generated" }
          # scanned statement: OCR must work inside the frozen exe, and rows must arrive unverified
          python tests/make_scanned_sample.py scan_sample.pdf table
          $st = Invoke-RestMethod "$base/api/ocr/status" -WebSession $s
          if (-not $st.available) { throw "OCR engine missing from the bundle: $($st.detail)" }
          $bank = Call-Api "/api/ledgers" @{ name = "CI Bank"; group = "Bank Accounts"; opening = "50000" }
          $imp = Invoke-RestMethod "$base/api/bank/import?bank_id=$($bank.id)&filename=scan.pdf" -Method Post -Headers $h -ContentType "application/octet-stream" -InFile scan_sample.pdf -WebSession $s -TimeoutSec 300
          if (-not $imp.ocr) { throw "scanned PDF was not read with OCR" }
          if ($imp.new -lt 5) { throw "OCR found only $($imp.new) rows" }
          if ($imp.needs_review -ne $imp.new) { throw "OCR rows must start unverified" }
          $pg = Get-Bytes "/api/bank/page?import_id=$($imp.import_id)&page=1"
          if ($pg[0] -ne 255 -or $pg[1] -ne 216) { throw "page image missing" }
          $post = Call-Api "/api/bank/post" @{ all_for_bank = $bank.id; suspense = $true }
          if ($post.posted -ne 0 -or $post.unverified -ne $imp.new) { throw "unverified rows were posted" }
          Write-Host "OCR in exe OK: $($imp.new) rows read, none postable until verified"
          $bk = Get-Bytes "/api/backup"
          if ([System.Text.Encoding]::ASCII.GetString($bk[0..1]) -ne "PK") { throw "backup not generated" }
          Call-Api "/api/shutdown" @{} | Out-Null
          Write-Host "Frozen exe: web mode, sign-in, PDF, Excel, Tally XML, OCR and backup all OK"
      - name: Build installer
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) { choco install innosetup -y --no-progress }
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" }
          & $iscc installer\EasyTally.iss
      - uses: actions/upload-artifact@v4
        with:
          name: EasyTally-Setup
          path: easy_tally/dist-installer/EasyTally-Setup.exe
      - uses: actions/upload-artifact@v4
        with:
          name: EasyTally-portable
          path: easy_tally/dist/EasyTally
