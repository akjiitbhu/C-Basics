name: Build Windows installer

on:
  workflow_dispatch:
  push:
    branches: [ "claude/**" ]
    paths: [ "easy_tally/**", ".github/workflows/build-windows.yml" ]
    tags: [ "v*" ]

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: easy_tally
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt reportlab pyinstaller
      - name: Run tests
        run: python -m unittest discover -s tests -t .
      - name: Build EasyTally.exe
        run: >
          python -m PyInstaller --noconfirm --clean --windowed --name EasyTally
          --collect-all pdfplumber --collect-all pdfminer --collect-all pypdfium2 --add-data "easytally/web/static;easytally/web/static" run.py
      - name: Smoke-test the built exe in browser mode
        shell: pwsh
        run: |
          $p = Start-Process dist\EasyTally\EasyTally.exe -ArgumentList "--web" -PassThru
          $ok = $false
          foreach ($i in 1..30) {
            Start-Sleep -Seconds 1
            try { $r = Invoke-RestMethod http://127.0.0.1:8765/api/ping; if ($r.app -eq "EasyTally") { $ok = $true; break } } catch {}
          }
          if (-not $ok) { throw "EasyTally --web did not start" }
          $page = (Invoke-WebRequest http://127.0.0.1:8765/ -UseBasicParsing).Content
          if ($page -notmatch "EasyTally") { throw "UI page missing from bundle" }
          $h = @{ "X-EasyTally" = "1" }
          Invoke-RestMethod http://127.0.0.1:8765/api/company/create -Method Post -Headers $h -ContentType "application/json" -Body '{"name":"CI Smoke Co","state":"27"}' | Out-Null
          $m = Invoke-RestMethod http://127.0.0.1:8765/api/meta
          if ($m.company -ne "CI Smoke Co") { throw "company not created" }
          Invoke-RestMethod http://127.0.0.1:8765/api/shutdown -Method Post -Headers $h -ContentType "application/json" -Body '{}' | Out-Null
          Write-Host "Frozen exe web mode OK"
      - name: Build installer
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) { choco install innosetup -y --no-progress }
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" }
          & $iscc installer\EasyTally.iss
      - uses: actions/upload-artifact@v4
        with:
          name: EasyTally-Setup
          path: easy_tally/dist-installer/EasyTally-Setup.exe
      - uses: actions/upload-artifact@v4
        with:
          name: EasyTally-portable
          path: easy_tally/dist/EasyTally
